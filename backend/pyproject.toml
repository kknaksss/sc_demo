[project]
name = "sc-demo-backend"
version = "0.1.0"
description = "sc_demo backend — FastAPI + SQLAlchemy async (SC-WP-01 C2 skeleton)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

# 앱(라이브러리 아님) — uv 가 프로젝트 자체를 빌드하지 않도록.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
# 생성물(alembic revision)은 린트 제외.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
