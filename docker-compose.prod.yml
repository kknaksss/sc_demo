# sc_demo — prod compose (standalone, home-server). PLAN-106-T-001.
#
# 실행 (서버 ~/sc_demo, 레포 보유 — 서버에서 직접 빌드):
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# 선행 (서버 1회) — 볼륨 디렉토리 생성(/mnt/data = sda1):
#   mkdir -p /mnt/data/sc_demo/personal /mnt/data/sc_demo/pgdata /mnt/data/sc_demo/claude_sessions
#
# dev 의 docker-compose.yml 과 독립된 standalone 파일이다(base override 아님):
# - back/worker/front 는 서버에서 직접 build(레포 컨텍스트). postgres/redis 는 공식 이미지.
#   (GHCR pull 모델 아님 — GitHub Action 미사용, 수동 배포.)
# - medi-doc 은 back/worker 이미지에 bake(레포 컨텍스트에서 COPY).
# - claude 는 worker 이미지에 설치하지 않고 **호스트 네이티브 바이너리**(self-contained x86-64 ELF,
#   `~/.local/bin/claude` → `~/.local/share/claude/versions/X`)를 같은 절대경로로 `:ro` 마운트 + PATH 우선.
#   (서버에 npm 없어 .claude-tools 스테이징 불가 → 네이티브 직접 마운트. 호스트 claude 설치 경로가
#   `/home/kknaks/.local` 이라는 전제 — 다른 서버면 worker volumes/PATH 의 경로 수정.)
# - 볼륨 = /mnt/data/sc_demo bind 3종(named volume 아님). 쿠키 secure 는 backend env COOKIE_SECURE=true.

services:
  # FastAPI — 도서관/개인스페이스/유저/채팅 REST + WS (SC-SPEC-01~04)
  backend:
    build:
      context: . # 루트 컨텍스트 — medi-doc bake(backend/Dockerfile.prod 가 COPY)
      dockerfile: backend/Dockerfile.prod
    image: sc_demo-back:local
    env_file: .env.prod
    ports:
      - "33080:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sc_demo}:${POSTGRES_PASSWORD:-sc_demo}@postgres:5432/${POSTGRES_DB:-sc_demo}
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: "true" # https(NPM same-origin) → secure 쿠키
    volumes:
      - /mnt/data/sc_demo/personal:/app/data/personal # 개인스페이스 파일 rw (backend 전용)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # open-kknaks 단일 워커 — Claude Code PTY 로 채팅 응답 생성 (SC-SPEC-04).
  worker:
    build:
      context: . # 루트 컨텍스트 — medi-doc bake. claude 는 미설치(호스트 네이티브 바이너리 마운트)
      dockerfile: backend/Dockerfile.worker.prod
    image: sc_demo-worker:local
    # CLAUDE_CODE_OAUTH_TOKEN 은 env_file(.env.prod)로만 흐른다 — environment 에 박지 말 것
    # (빈 값이 env_file 을 덮어 토큰이 묻힌다).
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sc_demo}:${POSTGRES_PASSWORD:-sc_demo}@postgres:5432/${POSTGRES_DB:-sc_demo}
      REDIS_URL: redis://redis:6379/0
      # PATH — 호스트 네이티브 claude(~/.local/bin/claude → versions/X ELF) 우선.
      PATH: /home/kknaks/.local/bin:/app/.venv/bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      # 호스트 네이티브 claude(self-contained x86-64 ELF) :ro 마운트. 같은 절대경로로 마운트해야
      # ~/.local/bin/claude 심볼릭링크(→ ~/.local/share/claude/versions/X)가 컨테이너서 풀린다.
      # (서버에 npm 없어 .claude-tools 스테이징 불가 → 네이티브 바이너리 직접 마운트.)
      - /home/kknaks/.local:/home/kknaks/.local:ro
      - /mnt/data/sc_demo/claude_sessions:/root/.claude/projects # 멀티턴 resume transcript 영속
    deploy:
      replicas: 1 # 단일 워커 고정(resume 이식성)
    depends_on:
      backend:
        condition: service_started # 마이그레이션 owner=backend 먼저
    restart: always

  # Next.js (App Router) — 프론트엔드 (이미지: PLAN-106-T-002 frontend Dockerfile.prod 산출)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE: https://sc.kknaks.cloud # 빌드 시 인라인(클라 fetch/WS base)
    image: sc_demo-front:local
    ports:
      - "33000:3000"
    depends_on:
      backend:
        condition: service_started
    restart: always

  # PostgreSQL — 유저/개인스페이스/채팅 DB
  postgres:
    image: postgres:16
    env_file: .env.prod
    ports:
      - "33432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sc_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sc_demo}
      POSTGRES_DB: ${POSTGRES_DB:-sc_demo}
    volumes:
      - /mnt/data/sc_demo/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sc_demo} -d ${POSTGRES_DB:-sc_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  # Redis — open-kknaks 큐/브로커 + Streams(응답 스트리밍)
  redis:
    image: redis:7
    ports:
      - "33379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
